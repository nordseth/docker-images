name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # GitHub Actions cron is evaluated in UTC.
    - cron:  '15 23 * * THU'

jobs:
  build-push:
    strategy:
      # Don't let one failing image cancel (and skip pushing) the others.
      fail-fast: false
      matrix:
        image:
          - folder: action-runner
            push: nordseth/action-runner:latest
            smoke: ./bin/Runner.Listener --version && test -f k8s/index.js && sudo -n true
          - folder: ansible
            push: nordseth/ansible:latest
            smoke: ansible --version && kubectl version --client && helm version
          - folder: aspnetcore/10-ffmpeg
            push: nordseth/aspnetcore:10-ffmpeg
            smoke: dotnet --list-runtimes && ffmpeg -hide_banner -filters | grep -q vidstab
          - folder: aspnetcore/11-ffmpeg
            push: nordseth/aspnetcore:11-ffmpeg
            smoke: dotnet --list-runtimes && ffmpeg -hide_banner -filters | grep -q vidstab
          - folder: buildctl
            push: nordseth/buildctl:latest
            smoke: buildctl --version && kubectl version --client && helm version
          - folder: ci-base/dotnet-10
            push: nordseth/ci-base:dotnet-10
            smoke: dotnet --list-sdks && kubectl version --client && helm version && nibbler --help > /dev/null
          - folder: ci-base/dotnet-11
            push: nordseth/ci-base:dotnet-11
            smoke: dotnet --list-sdks && kubectl version --client && helm version && nibbler --help > /dev/null
          - folder: lego-kubectl
            push: nordseth/lego-kubectl:latest
            smoke: lego --version && kubectl version --client
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Build the Docker image
      run: |
        cd ${{ matrix.image.folder }}
        docker build . --file Dockerfile -t ${{ matrix.image.push }} --label build.commit.id=${{ github.sha }}
    - name: Smoke test
      # Runs through the image's own entrypoint, and via /bin/sh so a broken shell or entrypoint fails here.
      env:
        IMAGE: ${{ matrix.image.push }}
        SMOKE: ${{ matrix.image.smoke }}
      run: docker run --rm "$IMAGE" /bin/sh -c "set -e; $SMOKE"
    - name: Login to Docker Hub
      if: ${{ github.ref == 'refs/heads/main' }}
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Push image
      if: ${{ github.ref == 'refs/heads/main' }}
      run: docker push ${{ matrix.image.push }}
