updates:
- directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions/*" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: weekly
- directories:
  - /action-runner
  - /action-runner/dotnet
  - /ansible
  - /aspnetcore/10-ffmpeg
  - /aspnetcore/10-rpicam
  - /aspnetcore/11-ffmpeg
  - /aspnetcore/11-rpicam
  - /buildctl
  - /ci-base/dotnet-10
  - /ci-base/dotnet-11
  - /lego-kubectl
  package-ecosystem: docker
  schedule:
    interval: weekly
- directory: /.github/workflows
  package-ecosystem: npm
  schedule:
    interval: weekly
version: 2
