updates:
- directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions/*" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  package-ecosystem: github-actions
  schedule:
    interval: weekly
- directories:
  - "/**/*"
  ignore:
  - dependency-name: "*" # Images are pinned to a major version on purpose (e.g. dotnet-10 vs dotnet-11); add new folders for new majors.
    update-types: ["version-update:semver-major"]
  package-ecosystem: docker
  schedule:
    interval: weekly
- directory: /.github/workflows
  ignore:
  - dependency-name: "@github/copilot" # Managed by gh aw compile. Version-locked to the gh-aw compiler (lock.yml installs it by pinned version + checksum); do not bump.
  package-ecosystem: npm
  schedule:
    interval: weekly
version: 2
